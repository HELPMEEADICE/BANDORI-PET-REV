[package]
name = "pet-db-python"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
name = "_pet_db"
crate-type = ["cdylib"]
test = false
doctest = false

[dependencies]
pet-db = { path = "../pet-db" }
serde_json.workspace = true
pyo3 = { version = "0.29", features = ["abi3-py310", "generate-import-lib"] }

[build-dependencies]
pyo3-build-config = "0.29"
