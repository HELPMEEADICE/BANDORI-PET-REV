[workspace]
resolver = "2"
# `vendor/neocari` is a path dependency, not a member: its own unit tests need the
# upstream sample models (`assets/models/Hiyori`), which the upstream crate excludes
# from published sources. Keeping it out of the member list keeps
# `cargo test --workspace` green while still building it as a dependency.
exclude = ["vendor/neocari"]
members = [".", "crates/pet-config", "crates/pet-i18n", "crates/pet-live2d", "crates/pet-render", "crates/pet-input", "crates/pet-behavior", "crates/pet-window", "crates/pet-util", "crates/pet-assets"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.87"
license = "GPL-3.0-only"
authors = ["BANDORI-PET contributors"]
repository = "https://github.com/HELPMEEADICE/BANDORI-PET-REV"

[workspace.dependencies]
pet-i18n = { path = "crates/pet-i18n" }
pet-config = { path = "crates/pet-config" }
pet-assets = { path = "crates/pet-assets" }
pet-live2d = { path = "crates/pet-live2d" }
pet-render = { path = "crates/pet-render" }
pet-input = { path = "crates/pet-input" }
pet-behavior = { path = "crates/pet-behavior" }
pet-window = { path = "crates/pet-window" }
pet-util = { path = "crates/pet-util" }

# Live2D runtime: Cubism 2 `.moc` + Cubism 3/4/5 `.moc3`, pure Rust, GPL-3.0-only.
# Git submodule pinned to f4eee3e95ec27530a1ebfdb60aa6bd478b4cabbc.
neocari = { path = "vendor/neocari", features = ["wgpu"], default-features = false }

wgpu = "30"
winit = "0.30.13"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "time"] }
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_System_SystemInformation",
    "Win32_System_Registry",
    "Win32_System_Console",
    "Win32_Security",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
zstd = "0.14"
tar = "0.4"
tempfile = "3"
pollster = "1"
libc = "0.2"
x11rb = { version = "0.13.2", features = ["randr", "shape"] }
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSEvent", "NSResponder", "NSScreen", "NSView", "NSWindow", "NSGraphics", "objc2-core-foundation"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSEnumerator", "NSGeometry", "NSDictionary", "NSValue", "NSString"] }

[profile.release]
opt-level = "s"
lto = "fat"
panic = "abort"
codegen-units = 1
strip = "debuginfo"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2



[package]
name = "bandori-pet-native"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
pet-config.workspace = true
pet-assets.workspace = true
pet-live2d.workspace = true
pet-render.workspace = true
pet-input.workspace = true
pet-behavior.workspace = true
pet-window.workspace = true
pet-util.workspace = true
neocari.workspace = true
winit.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
memmap2 = "0.9"
fs2 = "0.4"
image.workspace = true

[target.'cfg(windows)'.dependencies]
windows.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[dev-dependencies]
tempfile = "3"
wgpu.workspace = true
