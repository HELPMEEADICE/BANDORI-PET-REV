name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  PYTHONUTF8: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  python-syntax:
    name: Python ${{ matrix.python-version }} syntax
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile every tracked Python source
        shell: python
        run: |
          import subprocess
          from pathlib import Path

          paths = subprocess.check_output(
              ["git", "ls-files", "-z", "--", "*.py"]
          ).decode("utf-8").split("\0")
          sources = [path for path in paths if path]
          assert sources, "No Python sources found"
          for path in sources:
              compile(Path(path).read_bytes(), path, "exec")
          print(f"Compiled {len(sources)} Python sources")

  static-checks:
    name: Python lint, resources, scripts and workflows
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install check tools
        run: python -m pip install -r requirements-dev.txt
      - name: Check Python for syntax and runtime mistakes
        run: python -m ruff check --output-format=github .
      - name: Validate tracked JSON resources and manifests
        shell: python
        run: |
          import json
          import subprocess
          from pathlib import Path

          paths = subprocess.check_output(
              ["git", "ls-files", "-z", "--", "*.json"]
          ).decode("utf-8").split("\0")
          for path in filter(None, paths):
              print(f"Checking {path}", flush=True)
              json.loads(Path(path).read_text(encoding="utf-8-sig"))
      - name: Check Bash installer syntax
        run: |
          while IFS= read -r -d '' source; do
            echo "Checking $source"
            bash -n "$source"
          done < <(git ls-files -z -- '*.sh')
      - name: Check JavaScript plugin and desktop extension syntax
        run: |
          node --version
          while IFS= read -r -d '' source; do
            echo "Checking $source"
            node --input-type=module --check < "$source"
          done < <(git ls-files -z -- '*.js')
      - name: Check PowerShell installer syntax
        shell: pwsh
        run: |
          foreach ($source in (git ls-files -- '*.ps1')) {
            Write-Host "Checking $source"
            $parseTokens = $null
            $parseErrors = $null
            $null = [System.Management.Automation.Language.Parser]::ParseFile(
              (Join-Path $PWD $source), [ref]$parseTokens, [ref]$parseErrors
            )
            if ($parseErrors.Count -gt 0) {
              throw ($parseErrors | Out-String)
            }
          }
      - name: Install actionlint
        env:
          ACTIONLINT_VERSION: "1.7.12"
          ACTIONLINT_SHA256: "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8"
        run: |
          archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl --fail --silent --show-error --location --retry 3 \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${archive}" \
            --output "$RUNNER_TEMP/$archive"
          echo "$ACTIONLINT_SHA256  $RUNNER_TEMP/$archive" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" actionlint
      - name: Validate GitHub Actions workflows
        run: '"$RUNNER_TEMP/actionlint" -color'

  luajit-syntax:
    name: LuaJIT plugin syntax
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install LuaJIT
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y luajit
          luajit -v
      - name: Compile every tracked Lua source without executing it
        run: |
          mapfile -d '' sources < <(git ls-files -z -- '*.lua')
          (( ${#sources[@]} > 0 ))
          bytecode="$(mktemp --suffix=.ljbc)"
          trap 'rm -f "$bytecode"' EXIT
          for source in "${sources[@]}"; do
            echo "Checking $source"
            luajit -b "$source" "$bytecode"
          done

  tests:
    name: Tests (${{ matrix.os }}, Python 3.12)
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      # These sources are ignored by Git but required by the runtime tests.
      # Keep revisions fixed so upstream changes do not break unrelated PRs.
      - name: Check out PySide6 Fluent Widgets
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: zhiyiYo/PyQt-Fluent-Widgets
          ref: d90c008c534b2b0079ce7981d19b2bc957b354a5
          path: third_party/PyQt-Fluent-Widgets
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            third_party/PyQt-Fluent-Widgets/requirements.txt
      - name: Install Linux GUI and audio libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libegl1 libgl1 libopengl0 libportaudio2 libsndfile1 \
            libxkbcommon0 libxcb-cursor0 libdbus-1-3 xvfb xauth
      - name: Install Python dependencies
        run: |
          python -m pip install -r requirements.txt -r requirements-dev.txt
          python -m pip install --no-deps -e third_party/PyQt-Fluent-Widgets
          python -m pip check
      - name: Verify Lua plugin runtime
        run: python -c "from lupa.luajit21 import LuaRuntime; print(LuaRuntime().eval('jit.version'))"
      - name: Run regression tests
        shell: bash
        run: |
          command=(python -m pytest tests -q --durations=15 --junitxml=test-results/pytest.xml)
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            xvfb-run -a "${command[@]}"
          else
            "${command[@]}"
          fi
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: pytest-${{ matrix.os }}-py3.12
          path: test-results/pytest.xml
          if-no-files-found: ignore
          retention-days: 14
