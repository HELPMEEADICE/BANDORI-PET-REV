name: Neocari pet backend

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-2022, python-arch: x64 }
          - { os: windows-11-arm, python-arch: arm64 }
          - { os: ubuntu-24.04, python-arch: x64 }
          - { os: ubuntu-24.04-arm, python-arch: arm64 }
          - { os: macos-latest, python-arch: arm64 }
          - { os: macos-26-intel, python-arch: x64 }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          architecture: ${{ matrix.python-arch }}
      - name: Install Rust
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy
          rustup default stable
      - name: Install X11 dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libxkbcommon-x11-0 libx11-dev libxrandr-dev xvfb
      - name: Check formatting
        run: cargo fmt --manifest-path native/pet_backend/Cargo.toml --all -- --check
      - name: Check and lint all targets
        run: cargo clippy --manifest-path native/pet_backend/Cargo.toml --workspace --all-targets --locked -- -D warnings
      - name: Build standalone pet
        run: cargo build --manifest-path native/pet_backend/Cargo.toml -p bandori-pet-native -p pet-assets --locked
      - name: Test native components
        run: cargo test --manifest-path native/pet_backend/Cargo.toml --workspace --all-targets --locked
      - name: Test X11 window integration
        if: runner.os == 'Linux'
        run: xvfb-run -a cargo test --manifest-path native/pet_backend/Cargo.toml -p pet-window --test x11 --locked -- --ignored
      - name: Test macOS Metal window lifecycle
        if: runner.os == 'macOS'
        run: cargo run --manifest-path native/pet_backend/Cargo.toml --example window_smoke --locked
      - name: Install IPC test dependencies
        run: python -m pip install pytest zstandard psutil
      - name: Build Python IPC extension and non-graphical Rust peer
        run: |
          python tools/build_ipc.py --debug
          cargo build --manifest-path native/pet_backend/Cargo.toml -p pet-ipc --example ipc_peer --locked
      - name: Test queue compatibility, concurrency and crash recovery
        run: python -m pytest tests/test_shared_memory_ipc.py tests/test_rust_ipc.py -q
      - name: Test Python archive bridge
        run: python -m pytest tests/test_native_assets.py -q
      - name: Test Python to Rust shared memory
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == Linux ]]; then
            xvfb-run -a python -m pytest tests/test_native_backend.py tests/test_shared_memory_ipc.py -q
          else
            python -m pytest tests/test_native_backend.py -q
          fi
