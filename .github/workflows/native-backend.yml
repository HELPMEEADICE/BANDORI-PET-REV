name: Neocari pet backend

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  database-python-abi:
    name: Database ABI / Python ${{ matrix.python-version }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          submodules: recursive
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install stable Rust and Python test runner
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          python -m pip install pytest
      - name: Build and test the native database binding
        run: |
          python tools/build_db.py --debug
          python -m pytest tests/test_rust_database.py -q
  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-2022, python-arch: x64 }
          - { os: windows-11-arm, python-arch: arm64 }
          - { os: ubuntu-24.04, python-arch: x64 }
          - { os: ubuntu-24.04-arm, python-arch: arm64 }
          - { os: macos-latest, python-arch: arm64 }
          - { os: macos-26-intel, python-arch: x64 }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          architecture: ${{ matrix.python-arch }}
      - name: Install Rust
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy
          rustup default stable
      - name: Install Linux GUI dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          # PySide6.QtGui also needs EGL/OpenGL for the Python archive bridge tests.
          sudo apt-get install -y \
            libegl1 libgl1 libopengl0 \
            libxkbcommon-dev libxkbcommon-x11-0 libx11-dev libxrandr-dev xvfb
      - name: Check formatting
        run: cargo fmt --manifest-path native/pet_backend/Cargo.toml --all -- --check
      - name: Check and lint all targets
        run: cargo clippy --manifest-path native/pet_backend/Cargo.toml --workspace --all-targets --locked -- -D warnings
      - name: Build standalone pet
        run: cargo build --manifest-path native/pet_backend/Cargo.toml -p bandori-pet-native -p pet-assets --locked
      - name: Test native components
        run: cargo test --manifest-path native/pet_backend/Cargo.toml --workspace --all-targets --locked
      - name: Test X11 window integration
        if: runner.os == 'Linux'
        run: xvfb-run -a cargo test --manifest-path native/pet_backend/Cargo.toml -p pet-window --test x11 --locked -- --ignored
      - name: Test macOS Metal window lifecycle
        if: runner.os == 'macOS'
        run: cargo run --manifest-path native/pet_backend/Cargo.toml --example window_smoke --locked
      - name: Install IPC test dependencies
        run: python -m pip install pytest zstandard psutil PySide6
      - name: Build Python IPC extension and non-graphical Rust peer
        run: |
          python tools/build_ipc.py --debug
          python tools/build_db.py --debug
          cargo build --manifest-path native/pet_backend/Cargo.toml -p pet-ipc --example ipc_peer --locked
          cargo build --manifest-path native/pet_backend/Cargo.toml -p pet-ipc --example level_peer --locked
          cargo build --manifest-path native/pet_backend/Cargo.toml -p pet-behavior --example music_trace --locked
      - name: Test native music parity and service lifecycle
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest tests/test_music_bounce.py -q
      - name: Test queue compatibility, concurrency and crash recovery
        run: python -m pytest tests/test_shared_memory_ipc.py tests/test_rust_ipc.py -q
      - name: Test native database compatibility, concurrency and recovery
        run: python -m pytest tests/test_rust_database.py -q
      - name: Test Python archive bridge
        run: python -m pytest tests/test_native_assets.py -q
      - name: Test Python to Rust shared memory
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == Linux ]]; then
            xvfb-run -a python -m pytest tests/test_native_backend.py tests/test_shared_memory_ipc.py -q
          else
            python -m pytest tests/test_native_backend.py -q
          fi
